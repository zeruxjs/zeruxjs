name: Package workspace CI (no publish)

on:
  push:
    branches: [master, dev, test]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'integration-lab/**'
      - 'package.json'
      - 'package-lock.json'
      - 'api-freeze.json'
      - '.github/workflows/package-*.yml'
      - 'SECURITY.md'
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'integration-lab/**'
      - 'package.json'
      - 'package-lock.json'
      - 'api-freeze.json'
      - '.github/workflows/package-*.yml'
      - 'SECURITY.md'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Source and security contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run versions:check
      - run: npm run verify:source
      - run: npm run api:freeze:check
      - name: Check committed lockfile before scheduling six platform installs
        run: npm run deps:check
      - run: npm run security:source
      - run: npm run test:workspace-tools
      - name: Write read-only release inventory
        if: always()
        shell: bash
        run: |
          mkdir -p integration-lab/reports
          node scripts/package-release.mjs --json > integration-lab/reports/source-release-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-release-inventory
          path: integration-lab/reports/source-release-inventory.json
          if-no-files-found: warn

  clean-consumer:
    name: npm / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: [source]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Reproducible root workspace installation
        run: npm ci --no-audit --no-fund
      - run: npm run build:workspaces -- --concurrency auto
      - run: npm run release:graph
      - name: Test all public packages from actual tarballs, not local symlinks
        run: npm run release:public:consumer
      - run: npm run release:foundation:consumer
      - run: npm run release:pack
      - run: npm run test:section84
      - name: Vulnerability audit (not just structural checks)
        run: npm run security:online
      - name: Installed-license artifacts
        run: npm run license:installed
