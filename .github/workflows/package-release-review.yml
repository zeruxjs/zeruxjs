name: Package release review (no publish)

on:
  workflow_dispatch:
    inputs:
      run_full_lab:
        description: 'Also require provider/browser lab (requires configured services, Redis Cluster and mail credentials)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-matrix:
    name: Release candidate / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run verify:source
      - run: npm run deps:check
      - run: npm ci --no-audit --no-fund
      - run: npm run security:online
      - run: npm run license:installed
      - run: npm run build:workspaces -- --concurrency auto
      - run: npm run release:public:consumer
      - run: npm run release:foundation:consumer
      - run: npm run release:pack
      - run: npm run test:section84
      - run: npm run test:workspace-tools

  integration-evidence:
    name: Full real-provider and browser evidence
    if: ${{ inputs.run_full_lab }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:workspaces -- --concurrency auto
      - name: Run actual full lab; every named suite required
        env:
          RUN_BROWSER_TESTS: '1'
          CHROMIUM_BIN: google-chrome
          ZX_TEST_PG_URL: ${{ secrets.ZX_TEST_PG_URL }}
          ZX_TEST_MYSQL_DB: ${{ secrets.ZX_TEST_MYSQL_DB }}
          ZX_TEST_MYSQL_USER: ${{ secrets.ZX_TEST_MYSQL_USER }}
          ZX_TEST_MYSQL_PASSWORD: ${{ secrets.ZX_TEST_MYSQL_PASSWORD }}
          ZX_TEST_MONGO_URI: ${{ secrets.ZX_TEST_MONGO_URI }}
          CACHE_REDIS_URL: ${{ secrets.CACHE_REDIS_URL }}
          QUEUE_REDIS_URL: ${{ secrets.QUEUE_REDIS_URL }}
          CACHE_REDIS_CLUSTER_NODES: ${{ secrets.CACHE_REDIS_CLUSTER_NODES }}
          QUEUE_REDIS_CLUSTER_NODES: ${{ secrets.QUEUE_REDIS_CLUSTER_NODES }}
          LAB_S3_ENDPOINT: ${{ secrets.LAB_S3_ENDPOINT }}
          LAB_S3_BUCKET: ${{ secrets.LAB_S3_BUCKET }}
          LAB_S3_ACCESS_KEY: ${{ secrets.LAB_S3_ACCESS_KEY }}
          LAB_S3_SECRET_KEY: ${{ secrets.LAB_S3_SECRET_KEY }}
          ZERUX_TEST_LIVE_SMTP: '1'
          ZERUX_TEST_LIVE_INBOUND: '1'
          ZERUX_TEST_SMTP_HOST: ${{ secrets.ZERUX_TEST_SMTP_HOST }}
          ZERUX_TEST_SMTP_USER: ${{ secrets.ZERUX_TEST_SMTP_USER }}
          ZERUX_TEST_SMTP_PASSWORD: ${{ secrets.ZERUX_TEST_SMTP_PASSWORD }}
          ZERUX_TEST_IMAP_HOST: ${{ secrets.ZERUX_TEST_IMAP_HOST }}
          ZERUX_TEST_IMAP_USER: ${{ secrets.ZERUX_TEST_IMAP_USER }}
          ZERUX_TEST_IMAP_PASSWORD: ${{ secrets.ZERUX_TEST_IMAP_PASSWORD }}
          ZERUX_TEST_POP3_HOST: ${{ secrets.ZERUX_TEST_POP3_HOST }}
          ZERUX_TEST_POP3_USER: ${{ secrets.ZERUX_TEST_POP3_USER }}
          ZERUX_TEST_POP3_PASSWORD: ${{ secrets.ZERUX_TEST_POP3_PASSWORD }}
        run: >-
          node scripts/integration-lab.mjs --all
          --require=source,sqlite,auth,pipeline,content,pg,mysql,mongo,redis-cache,redis-queue,redis-cluster,s3,smtp,imap,pop3,browser
          --report=integration-lab/reports/release-full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-lab-evidence
          path: integration-lab/reports/release-full.json
          if-no-files-found: warn

  verdict:
    name: Release GO/NO-GO (never publishes)
    if: always()
    needs: [release-matrix, integration-evidence]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce fail-closed release verdict from CI job status
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.release-matrix.result }}
          LAB_RESULT: ${{ needs.integration-evidence.result }}
          RUN_FULL_LAB: ${{ inputs.run_full_lab }}
          CI_GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          node scripts/ci-release-decision.mjs --json | tee release-verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-release-verdict
          path: release-verdict.json
          if-no-files-found: warn
