name: Safe GitLab branch mirror (optional)

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fast-forward only to GitLab (no branch/tag force or empty commits)
        shell: bash
        env:
          MIRROR_SSH_KEY: ${{ secrets.GIT_SSH_KEY }}
          GITLAB_KNOWN_HOSTS: ${{ secrets.GITLAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$MIRROR_SSH_KEY" ]]; then
            echo 'GitLab mirror disabled: repository secret GIT_SSH_KEY is not configured.'
            exit 0
          fi
          if git log -1 --pretty=%B | grep -Fq '[skip-sync]'; then
            echo 'Mirror skipped for [skip-sync] commit.'
            exit 0
          fi
          if [[ -z "$GITLAB_KNOWN_HOSTS" ]]; then
            echo 'GitLab mirror blocked: add a verified GITLAB_KNOWN_HOSTS secret.' >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$GITLAB_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          git remote add gitlab git@gitlab.com:zeruxjs/zeruxjs.git
          git push gitlab "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo 'Mirrored using fast-forward-only push; remote divergences are intentionally not overwritten.'
