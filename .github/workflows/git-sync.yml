name: GitHub to GitLab branch mirror

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref_name }}
      - name: Mirror GitHub files to GitLab and preserve both histories
        shell: bash
        env:
          MIRROR_SSH_KEY: ${{ secrets.GIT_SSH_KEY }}
          GITLAB_KNOWN_HOSTS: ${{ secrets.GITLAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$MIRROR_SSH_KEY" ]]; then
            echo 'GitLab mirror disabled: repository secret GIT_SSH_KEY is not configured.'
            exit 0
          fi
          if git log -1 --pretty=%B | grep -Fq '[skip-sync]'; then
            echo 'Mirror skipped for [skip-sync] commit.'
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ -n "$GITLAB_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$GITLAB_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo 'Using configured GitLab host keys.'
          else
            cp .github/gitlab_known_hosts ~/.ssh/known_hosts
            echo 'Using GitLab.com host key pinned from official GitLab documentation.'
          fi
          chmod 600 ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts'
          git remote add gitlab git@gitlab.com:zeruxjs/zeruxjs.git
          bash .github/scripts/mirror-gitlab.sh
