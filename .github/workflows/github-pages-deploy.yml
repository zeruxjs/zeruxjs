name: Build and deploy ecosystem sites

on:
  push:
    branches: [master, "version/*"]
    # Build every push, including version branches created from an existing commit.
    # A paths filter can suppress these pushes even when the branch pattern matches.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-static-sites
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/version/')
    runs-on: ubuntu-24.04
    outputs:
      site_commit: ${{ steps.publish.outputs.commit }}
    timeout-minutes: 20
    env:
      SITE_SOURCE_BRANCH: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The output worktree shares this ephemeral GitHub-token authentication.
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked build dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify site tooling uses checked-out workspace sources
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          for (const name of ['zuixs', '@zeruxjs/typescript', '@zeruxjs/performance', '@zeruxjs/search']) {
            const actual = fs.realpathSync(path.join('node_modules', name));
            const expected = fs.realpathSync(path.join('packages', name));
            assert.equal(actual, expected, `${name} must use the checked-out workspace`);
            console.log(`[site-tooling] ${name}: local workspace verified`);
          }
          NODE
      - name: Build workspace CSS, browser bundler, search and navigation tooling in parallel
        run: node scripts/build-workspaces.mjs --scope zuixs --scope @zeruxjs/typescript --scope @zeruxjs/performance --scope @zeruxjs/search
      - name: Build shared homepage and every configured site
        run: node scripts/build-sites.mjs
      - name: Verify raw Markdown and static Pages artifact (no Jekyll rendering)
        run: |
          node --input-type=module <<'NODE'
          import { verifySites, output } from './scripts/build-sites.mjs';
          const { previewMount } = await import('./scripts/site-preview.mjs');
          const result = await verifySites(output, { mount: previewMount() });
          if (!result.markdown) throw new Error('Raw Markdown exports missing');
          console.log(`[sites] ${result.markdown} unchanged Markdown exports verified; deployment uploads prebuilt static files without Jekyll.`);
          NODE
      - name: Publish generated folders to master-site and prepare complete artifact
        id: publish
        run: node scripts/publish-sites.mjs
      - name: Upload the master-site static tree for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-published

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the published master-site tree
        id: deployment
        uses: actions/github-script@v9
        env:
          SITE_BUILD_COMMIT: ${{ needs.build-and-publish.outputs.site_commit }}
        with:
          script: |
            // Pages identifies deployments by build version. Source SHAs may be shared
            // by master/version branches even though their generated artifacts differ.
            const version = process.env.SITE_BUILD_COMMIT;
            if (!/^[a-f0-9]{40}$/.test(version ?? '')) throw new Error('Missing published site commit');
            const repository = { owner: context.repo.owner, repo: context.repo.repo };
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...repository, run_id: context.runId, per_page: 100
            });
            const matches = artifacts.filter(item => item.name === 'github-pages' && !item.expired);
            if (matches.length !== 1) throw new Error('Expected exactly one current Pages artifact');
            const oidc = await core.getIDToken();
            core.setSecret(oidc);
            // Avoid logging API error objects containing the OIDC request payload.
            const request = async (route, parameters) => {
              try { return await github.request(route, { ...repository, ...parameters }); }
              catch (error) { throw new Error(`Pages API request failed (HTTP ${error.status ?? 'unknown'})`); }
            };
            const { data } = await request('POST /repos/{owner}/{repo}/pages/deployments', {
              artifact_id: matches[0].id, pages_build_version: version, oidc_token: oidc
            });
            const deployment = String(data.id ?? data.status_url?.split('/').pop() ?? version);
            core.setOutput('page_url', data.page_url);
            core.info(`Deploying output commit ${version}, artifact ${matches[0].id}`);
            for (let attempt = 0; attempt < 96; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const { data: state } = await request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                pages_deployment_id: deployment
              });
              core.info(`Pages deployment: ${state.status}`);
              if (state.status === 'succeed') return;
              if (['deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
                   'deployment_cancelled', 'deployment_lost'].includes(state.status)) {
                throw new Error(`Pages deployment failed: ${state.status}`);
              }
            }
            await request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
              pages_deployment_id: deployment
            });
            throw new Error('Pages deployment timed out');
