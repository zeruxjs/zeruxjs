name: Security PR Report

# Separate trusted workflow: safe for fork PRs. Never run privileged code from PR head.
on:
  workflow_run:
    workflows:
      - Security and Code Quality
      - Runtime and API Security
      - Advanced RESTler Fuzzing
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: security-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  comment:
    name: Update one consolidated PR comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run executes this file from the trusted default branch.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Update PR dashboard from run metadata and JSON/SARIF artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/security/pr_comment.py
