name: CodeQL security and quality

on:
  # PR branches are checked by pull_request; master is checked after merge.
  push:
    branches: [master]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    # Daily at 00:00 UTC; scheduled runs use the default branch.
    - cron: '0 0 * * *'
  workflow_dispatch:

# Restrict the default token; write permissions are granted per job only.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
          output: reports/codeql
      - name: Upload CodeQL report for PR dashboard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scan-codeql-${{ matrix.language }}
          path: reports/codeql/
          if-no-files-found: ignore
          retention-days: 14
