# Advanced CodeQL configuration for the ZeruxJS / ZyroJS / Zuix monorepo.
# Scans application and package source without npm install: the Section 66
# registry/lockfile release gate is checked separately in package-workspaces.yml.
name: CodeQL security and quality

on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    # Daily scan at 00:00 UTC (scheduled runs use the default branch).
    - cron: '0 0 * * *'
      timezone: UTC
  workflow_dispatch:

# CodeQL alone needs to upload code scanning results. No secrets, deployments,
# packages or repository write permissions are needed.
permissions: {}

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    concurrency:
      group: codeql-${{ github.workflow }}-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL (security and quality)
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            name: ProWorkspace CodeQL
            queries:
              - uses: security-and-quality
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - '**/build/**'
              - '**/coverage/**'
              - '**/.next/**'
              - '**/*.min.js'
      - name: Analyze and upload SARIF
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
