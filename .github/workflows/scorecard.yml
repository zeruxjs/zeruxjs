name: OpenSSF Scorecard

on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    # Scorecard publishes trusted default-branch results weekly.
    - cron: '0 0 * * 0'
      timezone: UTC
  workflow_dispatch:

# Scorecard publishing requires a dedicated restricted job.
permissions: read-all

jobs:
  scorecard:
    name: OpenSSF Scorecard (default branch)
    # Official publisher supports trusted default branch runs, not fork PRs.
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-scorecard
          path: scorecard.sarif
          retention-days: 14
      - name: Upload to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
