name: Recover workspace lockfile

on:
  push:
    branches: [master, dev, test]
    paths:
      - 'package.json'
      - 'packages/**/package.json'
      - 'package-lock.json'
      - '.github/workflows/package-lock-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: lock-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve package lock metadata
        id: current
        continue-on-error: true
        run: npm install --package-lock-only --ignore-scripts
      - name: Synchronize local workspace metadata after npm resolution
        run: npm run deps:sync-local
      - name: Require complete, validated dependency graph
        if: steps.current.outcome == 'failure'
        run: npm run deps:check
      - name: Prove resolved lockfile can install and build
        run: npm ci --no-audit --no-fund
      - name: Build resolved workspaces
        run: npm run build:workspaces -- --concurrency auto
      - name: Create reviewed recovery branch
        id: branch
        run: |
          branch="automation/lock-recovery-${GITHUB_RUN_ID}"
          git switch --create "$branch"
          git add -- package-lock.json
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: recover workspace lockfile'
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open recovery pull request
        if: steps.branch.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="${GITHUB_REF_NAME}"
          head="${{ steps.branch.outputs.branch }}"
          gh pr create \
            --base "$base" \
            --head "$head" \
            --title 'chore: recover workspace lockfile' \
            --body 'Generated by the reviewed lock recovery workflow after dependency graph validation.'
      - name: Re-run workspace validation workflow
        if: steps.branch.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: gh workflow run package-workspaces.yml --ref "$BRANCH"
