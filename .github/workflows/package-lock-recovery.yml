name: Recover workspace lockfile

on:
  push:
    branches: [master, dev, test]
    paths:
      - 'package.json'
      - 'packages/**/package.json'
      - 'package-lock.json'
      - '.github/workflows/package-lock-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve package lock metadata
        id: current
        continue-on-error: true
        run: npm install --package-lock-only --ignore-scripts
      - name: Synchronize local workspace metadata after npm resolution
        run: npm run deps:sync-local
      - name: Require complete, validated dependency graph
        if: steps.current.outcome == 'failure'
        run: npm run deps:check
      - name: Prove resolved lockfile can install and build
        run: npm ci --no-audit --no-fund
      - name: Build resolved workspaces
        run: npm run build:workspaces -- --concurrency auto
      - name: Retain validated lockfile for the proposal job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-workspace-lock
          path: package-lock.json
          retention-days: 1
          if-no-files-found: error

  propose:
    needs: recover
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job can propose repository changes; no dependency code runs here.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the validated lockfile from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-workspace-lock
          path: .
      - name: Create reviewed recovery branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/lock-recovery-${GITHUB_RUN_ID}"
          git switch --create "$branch"
          git add -- package-lock.json
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: recover workspace lockfile'
          gh auth setup-git
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open recovery pull request
        if: steps.branch.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          RECOVERY_BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$RECOVERY_BRANCH" \
            --title 'chore: recover workspace lockfile' \
            --body 'Generated by the reviewed lock recovery workflow after dependency graph validation.'
      - name: Re-run workspace validation workflow
        if: steps.branch.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: gh workflow run package-workspaces.yml --ref "$BRANCH"
