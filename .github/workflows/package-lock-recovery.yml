name: Recover package-lock (manual, no publish)

on:
  # Repair proposals are created automatically for trusted branches. A PR is
  # still required: we never alter master/dev/test directly or silently pass CI.
  push:
    branches: [master, dev, test]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**/package.json'
      - 'apps/**/package.json'
      - '.github/workflows/package-lock-recovery.yml'
  workflow_dispatch:
    inputs:
      open_pull_request:
        description: 'Propose the npm-resolved lockfile in a reviewable pull request (requires Actions PR permission)'
        required: true
        type: boolean
        default: true

# This is the only package maintenance workflow allowed to write a recovery
# branch. It never changes the selected branch or publishes to npm.
permissions: {}

concurrency:
  group: recover-root-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    name: Resolve lockfile and offer review-only PR
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      actions: write  # dispatch CI for PR branches created with GITHUB_TOKEN
    outputs:
      changed: ${{ steps.change.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate owned package version policy
        run: npm run versions:check
      - name: Check whether committed lockfile already passes
        id: current
        continue-on-error: true
        run: npm run deps:check
      - name: Resolve real registry metadata (do not run install scripts)
        if: steps.current.outcome == 'failure'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --fetch-retries=2
      - name: Synchronize local workspace metadata after npm resolution
        if: steps.current.outcome == 'failure'
        run: npm run deps:sync-local
      - name: Require complete, validated dependency graph
        if: steps.current.outcome == 'failure'
        run: npm run deps:check
      - name: Determine whether root lockfile changed
        if: steps.current.outcome == 'failure'
        id: change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Lockfile was already current; no recovery pull request needed.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff --stat -- package-lock.json
          fi
      - name: Upload exact root lockfile before any build/tests
        if: steps.change.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: root-package-lock-proposal
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Create review-only lockfile pull request
        if: ${{ steps.change.outputs.changed == 'true' && (github.event_name == 'push' || inputs.open_pull_request) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="automation/npm-lock-recovery-${RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -- package-lock.json
          git commit -m 'chore(lockfile): resolve missing registry dependencies'
          # No force push or change to the triggering branch.
          if ! git push origin "HEAD:refs/heads/$branch"; then
            echo '::warning::Cannot push recovery branch. Download the root-package-lock-proposal artifact and commit the reviewed lockfile manually.'
            exit 0
          fi
          # GITHUB_TOKEN pushes do NOT trigger normal push/PR workflows.
          # workflow_dispatch is an explicit exception; test the candidate SHA.
          if ! gh workflow run package-workspaces.yml --repo "$REPO" --ref "$branch"; then
            echo '::warning::Cannot dispatch candidate CI automatically. Run Package workspace CI manually on the recovery branch before merging.'
          fi
          if ! gh pr create --repo "$REPO" --base "$BASE_BRANCH" --head "$branch" \
            --title 'chore(lockfile): review npm registry lock recovery' \
            --body "Registry-resolved root package-lock.json generated by workflow run ${RUN_ID}. Only package-lock.json is changed. Review versions, URLs and integrities; wait for clean CI on this PR before merging. No npm publishing is performed."; then
            echo '::warning::Branch pushed but pull request could not be created. Check repository Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests. Alternatively open the branch manually or use the uploaded lockfile artifact.'
          fi
      - name: Explain next steps
        if: always()
        shell: bash
        run: |
          echo '### Lock recovery' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.current.outcome }}" = 'success' ]; then
            echo '- The committed lockfile was already complete. No pull request was needed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- Review the **root-package-lock-proposal** artifact (if uploaded) or the generated pull request.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '- Merge/commit the proposed lockfile only after reviewing npm versions, resolved URLs, integrity hashes and CI.' >> "$GITHUB_STEP_SUMMARY"
          echo '- The strict source gate remains red on the old branch until the corrected lockfile is committed.' >> "$GITHUB_STEP_SUMMARY"

  clean-install:
    name: Prove resolved lockfile can install and build
    needs: recover
    if: needs.recover.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Use recovered artifact, not stale committed lockfile
        uses: actions/download-artifact@v4
        with:
          name: root-package-lock-proposal
          path: .
      - run: npm run deps:check
      - name: Clean installation from recovered lockfile
        run: npm ci --no-audit --no-fund
      - run: npm run verify:source
      - run: npm run build:workspaces -- --concurrency auto
      - run: npm run release:public:consumer
      - name: Record provisional qualification status
        if: always()
        shell: bash
        run: |
          echo '### Lockfile consumer checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'A recovered lockfile is not release approval. Commit the reviewed artifact/PR and rerun the protected cross-platform package CI.' >> "$GITHUB_STEP_SUMMARY"
