name: Publish version-bumped packages to npm

on:
  push:
    branches: [master]
    paths:
      - 'packages/**/package.json'
      - 'package-lock.json'
      - 'scripts/publish-packages.ts'
      - 'scripts/workspace-publish.ts'
      - '.github/workflows/package-publish.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack without publishing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-production-publish
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      has_releases: ${{ steps.plan.outputs.has_releases }}
      artifact_id: ${{ steps.plan_artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - name: Compare every package version with npm and plan retries
        id: plan
        run: node --experimental-strip-types scripts/publish-packages.ts --plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: plan_artifact
        if: always()
        with:
          name: npm-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .npm-release/
          include-hidden-files: true
          if-no-files-found: error

  source:
    needs: plan
    if: needs.plan.outputs.has_releases == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - name: Check source and version contracts
        run: npm run verify:source

  prepare:
    outputs:
      artifact_id: ${{ steps.prepared_artifact.outputs.artifact-id }}
    needs: plan
    if: needs.plan.outputs.has_releases == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use release npm version
        run: node -e "const [major,minor,patch]=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if(!(major>11 || major===11 && (minor>5 || minor===5 && patch>=1))) throw new Error('npm 11.5.1+ is required for trusted publishing');"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          merge-multiple: true
          path: .npm-release/
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Require zero production audit findings
        run: npm audit --omit=dev --audit-level=low
      - name: Require complete license evidence
        run: npm run license:installed
      - name: Build workspaces in parallel
        run: npm run build:workspaces -- --concurrency auto
      - name: Pack selected releases and record archive integrity
        run: node --experimental-strip-types scripts/publish-packages.ts --pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: prepared_artifact
        if: always()
        with:
          name: npm-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .npm-release/
          include-hidden-files: true
          if-no-files-found: error
          # npm tarballs are already compressed.
          compression-level: 0

  publish:
    # Both independent gates must pass; dry runs still execute all preparation checks.
    needs: [source, prepare]
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - name: Use npm with trusted publishing support
        run: node -e "const [major,minor,patch]=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if(!(major>11 || major===11 && (minor>5 || minor===5 && patch>=1))) throw new Error('npm 11.5.1+ is required for trusted publishing');"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          merge-multiple: true
          path: .npm-release/
      - name: Publish exact verified archives through npm trusted publishing
        run: node --experimental-strip-types scripts/publish-packages.ts --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: npm-release-${{ github.sha }}-${{ github.run_attempt }}
          path: .npm-release/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
