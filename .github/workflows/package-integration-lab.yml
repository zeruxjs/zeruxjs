name: Package integration lab (manual, no publish)

on:
  workflow_dispatch:
    inputs:
      run_services:
        description: 'Run disposable PostgreSQL/MySQL/MongoDB/Redis/MinIO lab in addition to offline checks'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run deps:check
      - run: npm ci --no-audit --no-fund
      - run: npm run build:workspaces
      - name: Offline acceptance (must have test passes)
        run: node scripts/integration-lab.mjs --offline --require=source,sqlite,auth,pipeline,content --report=integration-lab/reports/offline.json
      - name: Start isolated services (never production)
        if: ${{ inputs.run_services }}
        run: docker compose -f integration-lab/compose.yml -p zerux-ci-${{ github.run_id }} up -d --wait
      - name: Exercise real SQL, Mongo, Redis and S3
        if: ${{ inputs.run_services }}
        env:
          ZX_TEST_PG_URL: postgresql://lab:lab_only_not_production@127.0.0.1:55432/zerux_lab
          ZX_TEST_PG_PORT: '55432'
          ZX_TEST_MYSQL_DB: zerux_lab
          ZX_TEST_MYSQL_USER: lab
          ZX_TEST_MYSQL_PASSWORD: lab_only_not_production
          ZX_TEST_MYSQL_PORT: '53306'
          ZX_TEST_MONGO_URI: mongodb://127.0.0.1:57017/zerux_lab
          ZX_TEST_MONGO_PORT: '57017'
          CACHE_REDIS_URL: redis://127.0.0.1:56379
          QUEUE_REDIS_URL: redis://127.0.0.1:56379
          LAB_REDIS_PORT: '56379'
          LAB_S3_ENDPOINT: http://127.0.0.1:59000
          LAB_S3_BUCKET: zerux-ci-temporary
          LAB_S3_EPHEMERAL_BUCKET: '1'
          LAB_S3_ACCESS_KEY: minio_lab_only
          LAB_S3_SECRET_KEY: minio_lab_secret_only
          LAB_S3_PORT: '59000'
        run: >-
          node scripts/integration-lab.mjs --live
          --only=pg,mysql,mongo,redis-cache,redis-queue,s3
          --require=pg,mysql,mongo,redis-cache,redis-queue,s3
          --report=integration-lab/reports/local-services.json
      - name: Collect docker diagnostics on failure
        if: failure() && inputs.run_services
        run: docker compose -f integration-lab/compose.yml -p zerux-ci-${{ github.run_id }} ps
      - name: Stop services and remove test volumes
        if: always() && inputs.run_services
        run: docker compose -f integration-lab/compose.yml -p zerux-ci-${{ github.run_id }} down -v --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-integration-evidence
          path: integration-lab/reports/*.json
          if-no-files-found: warn
